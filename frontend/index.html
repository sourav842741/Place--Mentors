<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F7F8FA" id="theme-color-meta" />

    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent Theme Flash (FOUC) -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = stored === "dark" || (stored !== "light" && prefersDark);
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
          var meta = document.getElementById("theme-color-meta");
          if (meta) {
            meta.setAttribute("content", isDark ? "#0A1210" : "#F7F8FA");
          }
        } catch (e) {}
      })();
    </script>

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- ==================== SEO TITLE ==================== -->

    <title>
      Place Mentor | AI Placement Preparation Platform for Students
    </title>

    <!-- ==================== SEO META ==================== -->

    />

    <!-- Kept from original -->
    <meta

      content="Place Mentor, placement preparation, placement preparation platform, AI placement preparation, DSA, coding practice, interview preparation, resume builder, AI planner, placement jobs, student placement"

    <meta name="author" content="Place Mentor" />
