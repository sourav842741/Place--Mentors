# =========================================
# Place Mentors - Full Stack Docker Compose
# Uses backend/.env and frontend/.env directly
# =========================================

services:
  # =========================================
  # MongoDB Database
  # =========================================
  mongo:
    image: mongo:7
    container_name: placementor-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: placementor
    networks:
      - placementor-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =========================================
  # Backend API Server
  # =========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placementor-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGOURL: mongodb://mongo:27017/placementor
      CLIENT_URL: http://localhost:3000
      BASE_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:3000
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - placementor-network
    volumes:
      - backend_uploads:/app/uploads

  # =========================================
  # Frontend React App (Nginx)
  # =========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SERVER_URL: http://localhost:5000
    container_name: placementor-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - placementor-network

# =========================================
# Networks
# =========================================
networks:
  placementor-network:
    driver: bridge

# =========================================
# Volumes
# =========================================
volumes:
  mongo_data:
    driver: local
  backend_uploads:
    driver: local