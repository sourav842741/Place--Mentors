services:
  mongo:
    image: mongo:7
    container_name: placementor-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: placementor
    networks:
      - placementor-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: souravkumar09/placementor-backend:latest
    container_name: placementor-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGOURL: mongodb://mongo:27017/placementor
      CLIENT_URL: http://localhost:3000
      BASE_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:3000
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - placementor-network
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    image: souravkumar09/placementor-frontend:latest
    container_name: placementor-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - placementor-network

networks:
  placementor-network:
    driver: bridge

volumes:
  mongo_data:
  backend_uploads: